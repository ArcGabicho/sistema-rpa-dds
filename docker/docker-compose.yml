name: sistema-rpa-dds

# Local stack: the API and the website. There is no database container — the
# API connects to the Azure SQL database in DB_CONNECTION_STRING. In
# production the server is deployed by Dokploy (docker/Dockerfile.server) and
# the client by Vercel; this file is only for running both together locally.

services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: ${DB_CONNECTION_STRING}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__ExpiresInMinutes: ${JWT_EXPIRES_IN_MINUTES:-60}
      Admin__Email: ${ADMIN_EMAIL}
      Admin__Password: ${ADMIN_PASSWORD}
      Admin__FullName: ${ADMIN_FULL_NAME:-Administrador}
      Cors__AllowedOrigins__0: ${CLIENT_ORIGIN:-http://localhost:3000}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      # Startup runs EF migrations against Azure SQL, which can take up to a
      # minute when a serverless database is resuming from auto-pause.
      start_period: 60s
    networks:
      - dds

  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
    depends_on:
      server:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_URL: http://server:8080
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    networks:
      - dds

networks:
  dds:
