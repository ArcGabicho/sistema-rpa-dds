name: sistema-rpa-dds

# Local development stack: a SQL Server for development, the API and the
# website. The API always uses the local sqlserver container here, never the
# Azure SQL database — that one (DB_CONNECTION_STRING in .env) is only for
# production, set on whatever platform deploys the API.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - mssql_data:/var/opt/mssql
    ports:
      - "${DB_PORT:-1433}:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - dds

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # sa is fine for a throwaway local database: on startup the API creates
      # it and applies the EF migrations itself, which needs dbcreator.
      ConnectionStrings__Default: Server=sqlserver,1433;Database=${DEV_DB_NAME:-db-rpa-dds};User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Jwt__Secret: ${JWT_SECRET}
      Jwt__ExpiresInMinutes: ${JWT_EXPIRES_IN_MINUTES:-60}
      Admin__Email: ${ADMIN_EMAIL}
      Admin__Password: ${ADMIN_PASSWORD}
      Admin__FullName: ${ADMIN_FULL_NAME:-Administrador}
      Cors__AllowedOrigins__0: ${CLIENT_ORIGIN:-http://localhost:3000}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - dds

  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
    depends_on:
      server:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_URL: http://server:8080
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    networks:
      - dds

networks:
  dds:

volumes:
  mssql_data:
