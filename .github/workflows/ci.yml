name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  client:
    name: Client (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/client/package-lock.json

      - name: Install dependencies
        working-directory: core/client
        run: npm ci

      - name: Lint
        working-directory: core/client
        run: npm run lint

      - name: Build
        working-directory: core/client
        run: npm run build

  server:
    name: Server (ASP.NET Core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        working-directory: core/server
        run: dotnet restore

      - name: Build
        working-directory: core/server
        run: dotnet build --configuration Release --no-restore

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          status=0
          for f in scripts/*.sh docker/database/init.sh; do
            echo "bash -n $f"
            bash -n "$f" || status=1
          done
          exit $status

  infra:
    name: Infra (Bicep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build main.bicep
        run: az bicep build --file infra/main.bicep --outfile /dev/null

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [client, server]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.client
          push: false
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.server
          push: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
